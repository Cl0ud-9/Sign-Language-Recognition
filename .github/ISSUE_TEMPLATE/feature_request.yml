name: Idea or feature request
description: Suggest a sign, a dataset improvement or a change to the app
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Please open one before writing code for a large change, so the approach can be agreed first
        (see [CONTRIBUTING](https://github.com/Cl0ud-9/Sign-Language-Recognition/blob/main/CONTRIBUTING.md)).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the project to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is it about?
      options:
        - New signs
        - The dataset
        - The model or training
        - The live app
        - Something else
